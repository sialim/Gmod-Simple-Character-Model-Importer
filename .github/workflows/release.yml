name: Build release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements-build.txt

      - name: Download build assets
        shell: pwsh
        run: .\scripts\download_build_assets.ps1

      - name: Build portable importer
        shell: pwsh
        run: .\tools\build_mmd_character_importer_exe.ps1 -Python .\.venv\Scripts\python.exe -Name sheepyfixed -OneDir

      - name: Package release
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $asset = "release\sheepyfixed-$tag-windows-x64.zip"
          Compress-Archive -LiteralPath .\release\sheepyfixed_portable -DestinationPath $asset -CompressionLevel Optimal
          "RELEASE_ASSET=$asset" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "$env:RELEASE_ASSET" --title "SheepyFixed ${{ github.ref_name }}" --notes "Portable Windows build. Extract the archive and keep _internal beside sheepyfixed.exe.\n\nHighlights: bulk queue, ragdoll-focused output, Koikatsu skeleton handling, and PMX bodygroup manifest support."
